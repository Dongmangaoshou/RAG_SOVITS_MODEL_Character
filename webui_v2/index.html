<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>虚拟角色对话系统 V2</title>
<link rel="stylesheet" href="style.css?v=2.1">
</head>
<body>
<div class="app">

  <!-- ===== 左侧边栏 ===== -->
  <aside class="sidebar">
    <div class="logo">
      <h1>角色对话</h1>
      <span class="ver">V2</span>
    </div>

    <div class="panel char-panel">
      <label class="panel-title">选择角色</label>
      <select id="charSelect" class="select"></select>
      <div id="charInfo" class="char-info"></div>
      <button id="charDetailBtn" class="ghost-btn" title="查看角色完整背景">角色详情</button>
    </div>

    <div class="panel state-panel">
      <label class="panel-title">角色状态</label>
      <div class="state-row">
        <span class="state-label">情感</span>
        <span id="emotionState" class="state-value">—</span>
      </div>
      <div class="state-row">
        <span class="state-label">强度</span>
        <div class="meter"><div id="emotionBar" class="meter-fill"></div></div>
      </div>
      <div class="state-row">
        <span class="state-label">关系</span>
        <span id="relState" class="state-value">—</span>
      </div>
      <div class="state-row">
        <span class="state-label">表情</span>
        <span id="exprState" class="state-value">—</span>
      </div>
      <div id="emotionHint" class="state-hint"></div>
      <button id="resetEmoBtn" class="ghost-btn">重置情感</button>
    </div>

    <div class="panel mem-panel">
      <label class="panel-title">角色记忆
        <span class="panel-actions">
          <button id="clearMemBtn" class="mini-btn" title="清空全部记忆">清空</button>
        </span>
      </label>
      <div id="memList" class="mem-list">
        <div class="mem-empty">暂无记忆</div>
      </div>
      <details class="profile-box">
        <summary>用户画像</summary>
        <div id="profileList" class="profile-list">加载中…</div>
      </details>
    </div>

    <div class="panel session-panel">
      <label class="panel-title">会话</label>
      <div class="session-actions">
        <button id="clearChatBtn" class="ghost-btn">清空对话</button>
        <button id="exportBtn" class="ghost-btn">导出记录</button>
      </div>
    </div>
  </aside>

  <!-- ===== 主对话区 ===== -->
  <main class="chat-area">
    <div id="chatWindow" class="chat-window"></div>

    <div class="input-bar">
      <button id="voiceBtn" class="icon-btn" title="语音输入（需要浏览器授权麦克风）">🎤</button>
      <textarea id="inputBox" class="input-box" rows="1"
        placeholder="对角色说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn" class="send-btn">发送</button>
    </div>
    <div class="input-hint">
      <span id="connState" class="conn-badge">连接检测中…</span>
      <label class="switch-label" title="回复后自动播放语音（需 TTS 服务运行）">
        <input type="checkbox" id="ttsToggle"> <span>自动语音</span>
      </label>
      <span id="voiceState" class="voice-state"></span>
      <span class="hint-text">V2：长期记忆 · 情感智能 · 低延迟</span>
    </div>
  </main>

</div>

<!-- ===== 角色详情弹窗 ===== -->
<div id="charModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">角色详情</h3>
      <button id="modalClose" class="modal-close">&times;</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script src="app.js?v=2.1"></script>
</body>
</html>
